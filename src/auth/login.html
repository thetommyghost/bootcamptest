<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0d10" />
<title>KAWADER · BOOTCAMP · SIGN IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" /></noscript>
<style>
:root{
  --bg-deep:#0b0d10;
  --bg-panel:#14181d;
  --bg-elev:#1c2128;
  --line:#2a313a;
  --ink:#e6ebf2;
  --ink-muted:#8a93a0;
  --signal-amber:#ffb547;
  --signal-amber-dim:#9e6f2c;
  --film-red:#d4574f;
  --font-display:'Bebas Neue','Oswald','Impact',sans-serif;
  --font-body:'Inter Tight',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.login-card{
  width:100%; max-width:380px;
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-left:3px solid var(--signal-amber);
  padding:32px 28px 28px;
}
.login-card h1{
  font-family:var(--font-display);
  font-weight:400;
  font-size:28px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--signal-amber);
  margin-bottom:4px;
}
.login-card .sub{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin-bottom:24px;
}
.login-card label{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin-bottom:4px;
  margin-top:16px;
}
.login-card input{
  display:block;
  width:100%;
  background:var(--bg-deep);
  border:1px solid var(--line);
  padding:10px 12px;
  font-family:var(--font-body);
  font-size:14px;
  color:var(--ink);
  outline:none;
  transition:border-color .15s;
}
.login-card input:focus{
  border-color:var(--signal-amber);
}
.login-card button{
  display:block;
  width:100%;
  margin-top:24px;
  padding:12px;
  background:transparent;
  border:1px solid var(--signal-amber);
  border-left:2px solid var(--signal-amber);
  color:var(--signal-amber);
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:0.12em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s;
}
.login-card button:hover{
  background:rgba(255,181,71,0.12);
}
.login-card .error{
  display:none;
  margin-top:14px;
  padding:8px 10px;
  background:rgba(212,87,79,0.12);
  border:1px solid var(--film-red);
  color:var(--film-red);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.04em;
}
.login-card .error.show{display:block;}
.login-card .foot{
  margin-top:18px;
  font-family:var(--font-mono);
  font-size:9.5px;
  color:var(--ink-dim);
  text-align:center;
  letter-spacing:0.06em;
}
</style>
</head>
<body>
<div class="login-card">
  <h1>KAWADER</h1>
  <div class="sub">Bootcamp · Sign in</div>
  <form id="loginForm" autocomplete="off">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="your member username" autocomplete="off" />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="your password" autocomplete="off" />
    <button type="submit">Enter</button>
  </form>
  <div class="error" id="errorMsg"></div>
  <div class="foot">KAWADER Bootcamp 2026 · Edward Said Institute</div>
</div>
<script>
const form = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const errorEl = document.getElementById('errorMsg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username.value.trim(), password: password.value }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error === 'invalid_credentials' ? 'Wrong username or password.' : 'Server error. Try again.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Enter';
      return;
    }
    localStorage.setItem('kawader_session', data.token);
    localStorage.setItem('kawader_user', JSON.stringify(data.user));
    window.location.href = '../simulation/index.html';
  } catch (err) {
    errorEl.textContent = 'Connection failed. Check your network.';
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Enter';
  }
});
</script>
</body>
</html>
