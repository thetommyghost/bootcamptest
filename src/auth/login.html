<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d10" />
  <title>KAWADER · BOOTCAMP · WELCOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" /></noscript>
  <style>
    :root{
      --bg-deep:#0b0d10;
      --bg-panel:#14181d;
      --bg-elev:#1c2128;
      --bg-overlay:rgba(11,13,16,0.92);
      --line:#2a313a;
      --line-strong:#3a4250;
      --ink:#e6ebf2;
      --ink-muted:#8a93a0;
      --ink-dim:#5a6370;
      --signal-amber:#ffb547;
      --signal-amber-dim:#9e6f2c;
      --tactical:#6dd58c;
      --film-red:#d4574f;
      --film-red-dim:#7e342f;
      
      --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
      --font-display:'Bebas Neue','Oswald','Impact',sans-serif;
      --font-body:'Inter Tight','IBM Plex Sans',system-ui,-apple-system,sans-serif;
      --font-ar:'IBM Plex Sans Arabic','Tajawal',sans-serif;
      
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%; margin:0;}
    body{
      color:var(--ink); background:var(--bg-deep);
      font-family:var(--font-body); font-size:14px; line-height:1.5;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow:hidden; overscroll-behavior:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .welcome-container{
      text-align:center;
      padding:20px;
    }
    .welcome-image{
      max-width:90vw;
      max-height:80vh;
      border-radius:8px;
      box-shadow:0 4px 20px rgba(0,0,0,0.5);
      opacity:0;
      transform:scale(0.8);
      transition:opacity 1.5s ease, transform 1.5s ease;
    }
    .welcome-image.visible{
      opacity:1;
      transform:scale(1);
    }
    @media (prefers-reduced-motion: reduce){
      .welcome-image{
        transition:none;
      }
      .welcome-image.visible{
        opacity:1;
        transform:scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <img src="../../assets/venue/venue_painted_v1.jpg" 
         alt="KAWADER Bootcamp 2026 - Edward Said Cultural Institute" 
         class="welcome-image"
         id="welcomeImage">
  </div>
  
  <script>
    // Wait for image to load, then show animation
    const welcomeImage = document.getElementById('welcomeImage');
    
    // Function to handle image load
    function handleImageLoad() {
      // Add slight delay then show image
      setTimeout(() => {
        welcomeImage.classList.add('visible');
      }, 100);
      
      // After animation completes, proceed with login and redirect
      setTimeout(() => {
        // Auto-login for development - create mock user and redirect to simulation
        window.__user = {
          name: 'Participant',
          role: 'camper'
        };
        
        // Store mock user data
        localStorage.setItem('kawader_session', 'mock-token-for-development');
        localStorage.setItem('kawader_user', JSON.stringify(window.__user));
        
        // Redirect to simulation
        window.location.href = '../simulation/index.html';
      }, 3000); // 3 seconds for animation to complete
    }
    
    // Handle image loading
    if (welcomeImage.complete) {
      handleImageLoad();
    } else {
      welcomeImage.onload = handleImageLoad;
      welcomeImage.onerror = () => {
        // If image fails to load, proceed directly to login
        window.__user = {
          name: 'Participant',
          role: 'camper'
        };
        localStorage.setItem('kawader_session', 'mock-token-for-development');
        localStorage.setItem('kawader_user', JSON.stringify(window.__user));
        window.location.href = '../simulation/index.html';
      };
    }
  </script>
</body>
</html>
