<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d10" />
  <title>KAWADER · Workshops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" /></noscript>
  <style>
    :root{
      --bg-deep:#0b0d10;
      --bg-panel:#14181d;
      --bg-elev:#1c2128;
      --line:#2a313a;
      --line-strong:#3a4250;
      --ink:#e6ebf2;
      --ink-muted:#8a93a0;
      --ink-dim:#5a6370;
      --signal-amber:#ffb547;
      --signal-amber-dim:#9e6f2c;
      --tactical:#6dd58c;
      --tactical-dim:#2d6b42;
      --film-red:#d4574f;
      --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
      --font-display:'Bebas Neue','Oswald','Impact',sans-serif;
      --font-body:'Inter Tight','IBM Plex Sans',system-ui,-apple-system,sans-serif;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%; margin:0;}
    body{
      color:var(--ink); background:var(--bg-deep);
      font-family:var(--font-body); font-size:14px; line-height:1.5;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow-y:auto; overscroll-behavior:none;
    }

    .topbar{
      position:sticky; top:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 20px;
      background:var(--bg-panel);
      border-bottom:1px solid var(--line);
      padding-top:calc(12px + var(--safe-top));
    }
    .topbar-brand{
      font-family:var(--font-display);
      font-size:20px; letter-spacing:1.5px;
      color:var(--signal-amber);
    }
    .topbar-user{
      display:flex; align-items:center; gap:12px;
    }
    .topbar-user .name{
      font-size:13px; color:var(--ink-muted);
    }
    .topbar-user .role-badge{
      font-size:10px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.5px;
      padding:3px 8px; border-radius:4px;
      background:rgba(109,213,140,0.12);
      color:var(--tactical);
      border:1px solid var(--tactical-dim);
    }
    .topbar-user .role-badge.admin{
      background:rgba(255,181,71,0.12);
      color:var(--signal-amber);
      border-color:var(--signal-amber-dim);
    }
    .logout-btn{
      background:none; border:1px solid var(--line);
      color:var(--ink-muted); border-radius:4px;
      padding:6px 12px; font-size:12px;
      cursor:pointer; font-family:var(--font-body);
      transition:border-color 0.2s, color 0.2s;
    }
    .logout-btn:hover{ border-color:var(--film-red); color:var(--film-red); }

    .page{ padding:24px 20px; max-width:800px; margin:0 auto; }

    .page-title{
      font-family:var(--font-display);
      font-size:28px; letter-spacing:1px;
      margin:0 0 4px 0; color:var(--ink);
    }
    .page-subtitle{
      font-size:13px; color:var(--ink-muted);
      margin:0 0 24px 0;
    }

    .summary-bar{
      display:flex; gap:16px; margin-bottom:24px;
    }
    .summary-stat{
      background:var(--bg-panel);
      border:1px solid var(--line);
      border-radius:8px;
      padding:12px 16px;
      flex:1; text-align:center;
    }
    .summary-stat .num{
      font-family:var(--font-display);
      font-size:28px; color:var(--signal-amber);
      display:block; line-height:1;
    }
    .summary-stat .label{
      font-size:11px; color:var(--ink-dim);
      text-transform:uppercase; letter-spacing:0.5px;
    }

    .workshop-card{
      background:var(--bg-panel);
      border:1px solid var(--line);
      border-radius:10px;
      padding:20px;
      margin-bottom:12px;
      display:flex; gap:16px; align-items:flex-start;
      transition:border-color 0.2s;
    }
    .workshop-card.attended{
      border-color:var(--tactical-dim);
    }

    .ws-status{
      flex-shrink:0;
      width:36px; height:36px;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:18px;
      background:rgba(90,99,112,0.15);
      border:1px solid var(--line);
    }
    .workshop-card.attended .ws-status{
      background:rgba(109,213,140,0.15);
      border-color:var(--tactical-dim);
      color:var(--tactical);
    }

    .ws-info{ flex:1; min-width:0; }
    .ws-title{
      font-weight:600; font-size:15px;
      margin:0 0 4px 0; color:var(--ink);
    }
    .ws-desc{
      font-size:13px; color:var(--ink-muted);
      margin:0 0 10px 0; line-height:1.4;
    }
    .ws-meta{
      display:flex; flex-wrap:wrap; gap:12px;
      font-size:11px; color:var(--ink-dim);
    }
    .ws-meta span{
      display:flex; align-items:center; gap:4px;
    }
    .ws-meta .dot{
      width:4px; height:4px; border-radius:50%;
      background:var(--ink-dim); display:inline-block;
    }

    .ws-badge{
      flex-shrink:0;
      align-self:center;
      font-size:10px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.5px;
      padding:4px 10px; border-radius:4px;
    }
    .ws-badge.visited{
      background:rgba(109,213,140,0.12);
      color:var(--tactical);
      border:1px solid var(--tactical-dim);
    }
    .ws-badge.missed{
      background:rgba(90,99,112,0.1);
      color:var(--ink-dim);
      border:1px solid var(--line);
    }

    .empty-state{
      text-align:center; padding:60px 20px;
      color:var(--ink-dim); font-size:14px;
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; animation:none !important; }
    }
    @media (max-width:480px){
      .summary-bar{ flex-direction:column; gap:8px; }
      .workshop-card{ flex-direction:column; }
      .ws-badge{ align-self:flex-start; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-brand">KAWADER</div>
    <div class="topbar-user">
      <span class="name" id="userName"></span>
      <span class="role-badge" id="userRole"></span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="page">
    <h1 class="page-title">WORKSHOPS</h1>
    <p class="page-subtitle" id="pageSubtitle">Loading workshops...</p>

    <div class="summary-bar" id="summaryBar">
      <div class="summary-stat">
        <span class="num" id="statTotal">-</span>
        <span class="label">Total</span>
      </div>
      <div class="summary-stat">
        <span class="num" id="statAttended">-</span>
        <span class="label">Attended</span>
      </div>
      <div class="summary-stat">
        <span class="num" id="statMissed">-</span>
        <span class="label">Missed</span>
      </div>
    </div>

    <div id="workshopList">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

  <script>
    (function(){
      var token = localStorage.getItem('kawader_session');
      var userStr = localStorage.getItem('kawader_user');
      if(!token || !userStr){
        window.location.href = '../auth/login.html';
        return;
      }
      var user;
      try{ user = JSON.parse(userStr); }catch(e){
        window.location.href = '../auth/login.html';
        return;
      }

      document.getElementById('userName').textContent = user.name;
      var roleBadge = document.getElementById('userRole');
      roleBadge.textContent = user.role;
      if(user.role === 'admin') roleBadge.classList.add('admin');

      document.getElementById('logoutBtn').addEventListener('click', function(){
        localStorage.removeItem('kawader_session');
        localStorage.removeItem('kawader_user');
        window.location.href = '../auth/login.html';
      });

      if(user.role === 'admin'){
        var adminLink = document.createElement('a');
        adminLink.href = '../admin/attendance.html';
        adminLink.textContent = 'Admin Panel';
        adminLink.style.cssText = 'color:var(--signal-amber);text-decoration:none;font-size:12px;border:1px solid var(--signal-amber-dim);padding:5px 10px;border-radius:4px;';
        document.querySelector('.topbar-user').insertBefore(adminLink, document.getElementById('logoutBtn'));
      }

      var workshops = [];
      var attendance = {};

      Promise.all([
        fetch('../../assets/workshops.json').then(function(r){ return r.json(); }),
        fetch('../../assets/attendance-test.json').then(function(r){ return r.json(); })
      ]).then(function(results){
        workshops = results[0];
        attendance = results[1];

        var stored = localStorage.getItem('kawader_attendance');
        if(stored){
          try{ attendance = JSON.parse(stored); }catch(e){}
        }

        var myAttend = attendance[user.id] || [];
        var attendedCount = 0;

        document.getElementById('pageSubtitle').textContent =
          user.name + ' \u2014 ' + workshops.length + ' workshops scheduled';

        var html = '';
        for(var i = 0; i < workshops.length; i++){
          var ws = workshops[i];
          var didAttend = myAttend.indexOf(ws.id) !== -1;
          if(didAttend) attendedCount++;

          var dateObj = new Date(ws.date + 'T00:00:00');
          var dateStr = dateObj.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

          var attendees = 0;
          for(var cid in attendance){
            if(attendance[cid].indexOf(ws.id) !== -1) attendees++;
          }

          html += '<div class="workshop-card' + (didAttend ? ' attended' : '') + '">';
          html += '  <div class="ws-status">' + (didAttend ? '&#10003;' : (i+1)) + '</div>';
          html += '  <div class="ws-info">';
          html += '    <h3 class="ws-title">' + escapeHtml(ws.title) + '</h3>';
          html += '    <p class="ws-desc">' + escapeHtml(ws.description) + '</p>';
          html += '    <div class="ws-meta">';
          html += '      <span>' + dateStr + '</span>';
          html += '      <span><span class="dot"></span>' + escapeHtml(ws.time) + '</span>';
          html += '      <span><span class="dot"></span>' + escapeHtml(ws.location) + '</span>';
          html += '      <span><span class="dot"></span>' + escapeHtml(ws.instructor) + '</span>';
          html += '      <span>' + attendees + ' attended</span>';
          html += '    </div>';
          html += '  </div>';
          html += '  <div class="ws-badge ' + (didAttend ? 'visited' : 'missed') + '">';
          html += (didAttend ? 'Attended' : 'Missed');
          html += '  </div>';
          html += '</div>';
        }

        document.getElementById('workshopList').innerHTML = html;
        document.getElementById('statTotal').textContent = workshops.length;
        document.getElementById('statAttended').textContent = attendedCount;
        document.getElementById('statMissed').textContent = workshops.length - attendedCount;
      }).catch(function(err){
        document.getElementById('workshopList').innerHTML =
          '<div class="empty-state">Failed to load workshops: ' + escapeHtml(String(err)) + '</div>';
      });

      function escapeHtml(s){
        return String(s)
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;')
          .replace(/'/g,'&#39;');
      }
    })();
  </script>
</body>
</html>
