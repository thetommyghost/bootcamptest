<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAWADER · Achievements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0b0d10; --bg-panel:#14181d; --bg-elev:#1c2128;
  --line:#2a313a; --line-strong:#3a4250;
  --ink:#e6ebf2; --ink-muted:#8a93a0; --ink-dim:#5a6370;
  --signal-amber:#ffb547; --signal-amber-dim:#9e6f2c;
  --tactical:#6dd58c; --film-red:#d4574f;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg-deep); color:var(--ink);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}
h1{
  font-family:var(--font-display);
  font-size:32px; letter-spacing:0.04em;
  color:var(--signal-amber); margin-bottom:8px;
  text-align:center;
}
.subtitle{ color:var(--ink-muted); font-size:13px; margin-bottom:24px; text-align:center; }
.list{ width:100%; max-width:480px; display:flex; flex-direction:column; gap:8px; }
.card{
  background:var(--bg-panel); border:1px solid var(--line);
  border-radius:8px; padding:16px; display:flex;
  align-items:center; gap:14px;
  transition:border-color 0.15s, background 0.15s;
}
.card.unlocked{ border-left:3px solid var(--tactical); background:var(--bg-elev); }
.card.locked{ border-left:3px solid var(--line-strong); opacity:0.6; }
.card-icon{
  width:40px; height:40px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.card.unlocked .card-icon{ background:rgba(109,213,140,0.12); color:var(--tactical); border:1px solid rgba(109,213,140,0.3); }
.card.locked .card-icon{ background:rgba(90,99,112,0.15); color:var(--ink-dim); border:1px solid var(--line); }
.card-body{ flex:1; }
.card-title{ font-weight:600; font-size:15px; }
.card.locked .card-title{ color:var(--ink-muted); }
.card-desc{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
.card-status{ font-size:11px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.06em; }
.card.unlocked .card-status{ color:var(--tactical); }
.card.locked .card-status{ color:var(--ink-dim); }
.btn-row{ display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; justify-content:center; }
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 18px; border-radius:6px;
  font-size:13px; font-weight:600; font-family:inherit;
  text-decoration:none; cursor:pointer;
  border:1px solid var(--line); background:var(--bg-panel);
  color:var(--ink); transition:background 0.15s, border-color 0.15s;
}
.btn:hover{ background:var(--bg-elev); border-color:var(--line-strong); }
.btn-primary{ background:var(--signal-amber); color:var(--bg-deep); border-color:var(--signal-amber); }
.btn-primary:hover{ background:#ffc86b; }
.count{ font-size:13px; color:var(--ink-muted); text-align:center; margin-bottom:16px; }
</style>
</head>
<body>

<h1>✦ ACHIEVEMENTS</h1>
<div class="subtitle">Milestones unlocked through exploration and creation</div>
<div class="count" id="countDisplay">0 / 3 unlocked</div>

<div class="list" id="achievementList"></div>

<div class="btn-row">
  <a href="../simulation/index.html" class="btn btn-primary">◀ VENUE</a>
  <a href="../achievements/tree.html" class="btn" style="border-color:var(--signal-amber-dim);color:var(--signal-amber);">🌳 ACHIEVEMENT TREE</a>
  <a href="../passport/index.html" class="btn">◀ PASSPORT</a>
</div>

<script>
var ACHIEVEMENTS = [
  { key: 'EXPLORER',  icon: '🗺', name: 'Explorer',     desc: 'Visit 3 different zones' },
  { key: 'CREATOR',   icon: '✎',  name: 'Creator',      desc: 'Create 2 notes' },
  { key: 'COLLABORATOR', icon: '🤝', name: 'Collaborator', desc: 'Get 2 approvals' }
];

function loadProgress(){
  var state = {};
  try {
    var raw = localStorage.getItem('kawader_achievements_v1');
    if (!raw) raw = localStorage.getItem('kawadar_achievements_v1');
    if (raw) state = JSON.parse(raw);
  } catch(e){}
  return state;
}

function render(){
  var state = loadProgress();
  var list = document.getElementById('achievementList');
  var count = document.getElementById('countDisplay');
  var unlocked = 0;

  list.innerHTML = '';
  for (var i = 0; i < ACHIEVEMENTS.length; i++){
    var a = ACHIEVEMENTS[i];
    var isUnlocked = state[a.key] === true;
    if (isUnlocked) unlocked++;

    var card = document.createElement('div');
    card.className = 'card ' + (isUnlocked ? 'unlocked' : 'locked');
    card.innerHTML =
      '<div class="card-icon">' + a.icon + '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + a.name + '</div>' +
        '<div class="card-desc">' + a.desc + '</div>' +
      '</div>' +
      '<div class="card-status">' + (isUnlocked ? '✓ UNLOCKED' : '🔒 LOCKED') + '</div>';
    list.appendChild(card);
  }

  count.textContent = unlocked + ' / ' + ACHIEVEMENTS.length + ' unlocked';
}

render();
</script>
</body>
</html>
