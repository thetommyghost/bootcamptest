<style>
:root{
  --bg-deep:#0b0d10;
  --bg-panel:#14181d;
  --bg-elev:#1c2128;
  --bg-overlay:rgba(11,13,16,0.92);
  --line:#2a313a;
  --line-strong:#3a4250;
  --ink:#e6ebf2;
  --ink-muted:#8a93a0;
  --ink-dim:#5a6370;
  --signal-amber:#ffb547;
  --signal-amber-dim:#9e6f2c;
  --tactical:#6dd58c;
  --film-red:#d4574f;
  --film-red-dim:#7e342f;
  --secret-purple:#a78bfa;
  --secret-purple-dim:#6d5ba3;
  --milestone-gold:#fbbf24;

  --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-display:'Bebas Neue','Oswald','Impact',sans-serif;
  --font-body:'Inter Tight','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Tajawal',sans-serif;

  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%; margin:0; overflow:hidden; background:var(--bg-deep);}
body{
  color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
svg{display:block;}
a{color:inherit; text-decoration:none;}

/* Viewer */
.tree-viewport{
  position:fixed; inset:0; overflow:hidden;
  cursor:grab; background:radial-gradient(ellipse at 50% 30%, #11151c, #0b0d10 70%);
}
.tree-viewport.dragging{cursor:grabbing;}
.tree-world{
  position:absolute; top:0; left:0; width:1px; height:1px;
  transform-origin:0 0;
  will-change:transform;
}
.tree-world svg{
  position:absolute; top:0; left:0; width:1600px; height:1300px;
  pointer-events:none;
}

/* Node base */
.node{
  position:absolute;
  width:88px; height:88px;
  transform:translate(-50%, -50%);
  cursor:pointer;
  transition:filter 0.3s ease, opacity 0.3s ease;
}
.node-inner{
  width:100%; height:100%;
  border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px;
  position:relative;
  transition:box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
}
.node-icon{font-size:28px; line-height:1; pointer-events:none; transition:opacity 0.3s ease;}
.node-label{
  font-family:var(--font-mono); font-size:7px; letter-spacing:0.08em;
  text-transform:uppercase; text-align:center; line-height:1.15;
  max-width:80px; pointer-events:none; transition:color 0.3s ease;
}
.node-title{
  position:absolute; left:50%; top:calc(100% + 6px);
  transform:translateX(-50%);
  font-family:var(--font-display); font-size:10px; letter-spacing:0.06em;
  text-transform:uppercase; text-align:center; white-space:nowrap;
  pointer-events:none; transition:color 0.3s ease;
}

/* Root node */
.node.root .node-inner{
  width:104px; height:104px;
  background:var(--bg-elev);
  border:2px solid var(--signal-amber);
  box-shadow:0 0 20px rgba(255,181,71,0.25), inset 0 0 20px rgba(255,181,71,0.05);
}
.node.root .node-title{color:var(--signal-amber); font-size:11px;}

/* Completed nodes */
.node.completed .node-inner{
  background:rgba(255,181,71,0.12);
  border:2px solid var(--signal-amber);
  box-shadow:0 0 16px rgba(255,181,71,0.35), 0 0 40px rgba(255,181,71,0.12);
}
.node.completed .node-title{color:var(--signal-amber);}
.node.completed .node-icon{opacity:1;}
.node.completed .node-label{color:var(--signal-amber-dim);}
.node.completed .check-badge{
  position:absolute; top:-4px; right:-4px;
  width:22px; height:22px; border-radius:50%;
  background:var(--signal-amber); color:#0b0d10;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; box-shadow:0 0 8px rgba(255,181,71,0.5);
  pointer-events:none;
}

/* Unlocked nodes */
.node.unlocked .node-inner{
  background:var(--bg-panel);
  border:1px solid var(--line-strong);
}
.node.unlocked .node-title{color:var(--ink-muted);}
.node.unlocked .node-icon{opacity:0.85;}
.node.unlocked .node-label{color:var(--ink-dim);}

/* Locked nodes */
.node.locked .node-inner{
  background:var(--bg-deep);
  border:1px solid var(--line);
  opacity:0.45; filter:grayscale(0.6);
}
.node.locked .node-title{color:var(--ink-dim);}
.node.locked .node-icon{opacity:0.35;}
.node.locked .node-label{color:var(--ink-dim);}

/* Secret locked */
.node.secret-locked .node-inner{
  background:rgba(123,91,168,0.08);
  border:1px solid rgba(123,91,168,0.25);
  opacity:0.5;
}
.node.secret-locked .node-title{color:rgba(123,91,168,0.5);}
.node.secret-locked .node-icon{opacity:0.3;}

/* Secret unlocked */
.node.secret .node-inner{
  background:rgba(167,139,250,0.12);
  border:2px solid var(--secret-purple);
  box-shadow:0 0 14px rgba(167,139,250,0.25);
}
.node.secret .node-title{color:var(--secret-purple);}
.node.secret .node-icon{opacity:1;}

/* Milestone nodes */
.node.milestone .node-inner{
  border-radius:8px; width:78px; height:78px;
}
.node.milestone.completed .node-inner{
  border-color:var(--milestone-gold);
  box-shadow:0 0 20px rgba(251,191,36,0.3), 0 0 50px rgba(251,191,36,0.1);
}
.node.milestone .node-title{font-size:8px;}

/* Type decorations */
.node.exploration .node-inner{border-left:3px solid var(--tactical);}
.node.scene .node-inner{border-left:3px solid var(--signal-amber);}
.node.collaboration .node-inner{border-left:3px solid var(--film-red);}

/* Hover */
.node:hover .node-inner{
  box-shadow:0 0 12px rgba(255,255,255,0.1);
}
.node.locked:hover .node-inner{opacity:0.6; filter:grayscale(0.4);}

/* SVG connection lines */
.conn-line{
  fill:none; stroke:var(--line); stroke-width:1.5;
  transition:stroke 0.5s ease, stroke-width 0.5s ease, stroke-opacity 0.5s ease;
}
.conn-line.any-unlocked{stroke:var(--line-strong); stroke-width:1.8;}
.conn-line.any-completed{stroke:var(--signal-amber-dim); stroke-width:2;}
.conn-line.all-completed{stroke:var(--signal-amber); stroke-width:2.5;
  filter:drop-shadow(0 0 4px rgba(255,181,71,0.3));}
.conn-line.secret-line{stroke:var(--secret-purple-dim); stroke-dasharray:4 4;}
.conn-line.secret-unlocked{stroke:var(--secret-purple); stroke-dasharray:none; stroke-width:2;
  filter:drop-shadow(0 0 4px rgba(167,139,250,0.3));}

/* Controls */
.tree-controls{
  position:fixed; top:16px; right:16px; z-index:100;
  display:flex; gap:8px;
}
.tree-ctrl{
  width:36px; height:36px; border-radius:6px;
  background:rgba(11,13,16,0.8); border:1px solid var(--line);
  color:var(--ink-muted); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; transition:background 0.15s, color 0.15s, border-color 0.15s;
  font-family:var(--font-mono);
}
.tree-ctrl:hover{background:var(--bg-elev); color:var(--ink); border-color:var(--line-strong);}

/* Zoom indicator */
.zoom-indicator{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(11,13,16,0.8); border:1px solid var(--line);
  border-radius:4px; padding:4px 12px;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-dim);
  opacity:0; transition:opacity 0.3s ease; pointer-events:none; z-index:100;
}
.zoom-indicator.show{opacity:1;}

/* Legend */
.tree-legend{
  position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
  display:flex; gap:16px; align-items:center;
  background:rgba(11,13,16,0.75); border:1px solid var(--line);
  border-radius:6px; padding:8px 16px; z-index:100;
  backdrop-filter:blur(4px);
}
.legend-item{
  display:flex; align-items:center; gap:6px;
  font-size:9px; font-family:var(--font-mono); letter-spacing:0.06em;
  text-transform:uppercase; color:var(--ink-dim);
}
.legend-dot{
  width:10px; height:10px; border-radius:50%; border:1px solid var(--line);
}
.legend-dot.completed{background:var(--signal-amber); border-color:var(--signal-amber);
  box-shadow:0 0 6px rgba(255,181,71,0.4);}
.legend-dot.unlocked{background:var(--bg-panel); border-color:var(--line-strong);}
.legend-dot.locked{background:var(--bg-deep); opacity:0.4;}
.legend-dot.secret{background:rgba(167,139,250,0.3); border-color:var(--secret-purple);}

/* Back link */
.back-link{
  position:fixed; top:16px; left:16px; z-index:100;
  display:flex; align-items:center; gap:6px;
  color:var(--ink-muted); font-family:var(--font-mono); font-size:11px;
  letter-spacing:0.06em; text-transform:uppercase;
  padding:8px 12px; border-radius:4px;
  background:rgba(11,13,16,0.8); border:1px solid var(--line);
  cursor:pointer; transition:background 0.15s, color 0.15s;
}
.back-link:hover{background:var(--bg-elev); color:var(--ink);}

/* Detail popup */
.detail-popup{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(120%);
  background:var(--bg-panel); border:1px solid var(--line-strong);
  border-left:3px solid var(--signal-amber); border-radius:8px;
  padding:18px 22px; max-width:420px; width:90vw;
  z-index:200; opacity:0;
  transition:transform 0.35s cubic-bezier(.2,.7,.2,1), opacity 0.35s ease;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  pointer-events:none;
}
.detail-popup.show{
  transform:translateX(-50%) translateY(0);
  opacity:1; pointer-events:auto;
}
.detail-popup .dp-header{
  display:flex; align-items:center; gap:12px; margin-bottom:10px;
}
.detail-popup .dp-icon{
  width:44px; height:44px; border-radius:50%;
  background:var(--bg-elev); display:flex;
  align-items:center; justify-content:center; font-size:22px;
  flex-shrink:0;
}
.detail-popup .dp-title{
  font-family:var(--font-display); font-size:1.1rem; letter-spacing:0.04em;
  text-transform:uppercase; color:var(--ink); margin:0;
}
.detail-popup .dp-type{
  font-size:9px; font-family:var(--font-mono); letter-spacing:0.1em;
  text-transform:uppercase; color:var(--ink-muted); margin-top:2px;
}
.detail-popup .dp-desc{
  font-size:0.85rem; color:var(--ink-muted); line-height:1.6;
  margin:0 0 12px;
}
.detail-popup .dp-footer{
  display:flex; align-items:center; justify-content:space-between;
  font-size:10px; font-family:var(--font-mono); letter-spacing:0.06em;
  text-transform:uppercase;
}
.detail-popup .dp-status{
  padding:3px 10px; border-radius:3px; font-weight:600;
}
.detail-popup .dp-status.completed{
  background:rgba(255,181,71,0.15); color:var(--signal-amber);
  border:1px solid var(--signal-amber-dim);
}
.detail-popup .dp-status.unlocked{
  background:rgba(255,255,255,0.05); color:var(--ink-muted);
  border:1px solid var(--line);
}
.detail-popup .dp-status.locked{
  background:transparent; color:var(--ink-dim);
  border:1px solid var(--line);
}
.detail-popup .dp-status.secret{
  background:rgba(167,139,250,0.15); color:var(--secret-purple);
  border:1px solid var(--secret-purple-dim);
}
.detail-popup .dp-dismiss{
  background:none; border:none; color:var(--ink-dim);
  font-family:var(--font-mono); font-size:10px; cursor:pointer; padding:4px 8px;
}
.detail-popup .dp-dismiss:hover{color:var(--ink-muted);}

/* Responsive */
@media (max-width:640px){
  .tree-legend{display:none;}
  .detail-popup{bottom:16px; padding:14px 16px; max-width:calc(100vw - 32px);}
  .detail-popup .dp-icon{width:36px; height:36px; font-size:18px;}
  .node{width:72px; height:72px;}
  .node.root .node-inner{width:88px; height:88px;}
  .node-icon{font-size:22px;}
  .node-title{font-size:8px;}
}

@media (prefers-reduced-motion: reduce){
  .node, .node-inner, .conn-line, .detail-popup{transition:none !important;}
}
</style>
</head>

    catch(e){return fallback;}
  }

  /* ── Compute actual state from localStorage ── */
  function computeState(){
    var achievements = loadJSON(ACH_KEY, null);
    var visited = loadJSON(VISITED_KEY, []);
    if (!Array.isArray(visited)) visited = [];
    var vCount = visited.length;

    // If achievements exist, derive state from them
    if (achievements){
      var state = {};
      NODES.forEach(function(n){
        if (n.is_secret){
          state[n.id] = 'locked_secret';
          return;
        }
        // Check achievement data
        var ach = achievements[n.id];
        if (ach && ach.unlocked){
          state[n.id] = 'completed';
        } else {
          // Check if conditions are partially met
          state[n.id] = derivePartial(n.id, vCount);
        }
      });
      return state;
    }

    // Fall back to mock data if no achievements exist
    return null; // signals mock
  }

  function derivePartial(nodeId, vCount){
    switch(nodeId){
      case 'arrival': return 'completed';
      case 'first_zone': return vCount >= 1 ? 'completed' : 'unlocked';
      case 'first_photo': return vCount >= 2 ? 'unlocked' : 'locked';
      case 'first_audio': return vCount >= 3 ? 'unlocked' : 'locked';
      case 'reflection': return 'locked';
      case 'mentor_feedback': return 'locked';
      case 'collab_project': return 'locked';
      case 'zones_3': return vCount >= 3 ? 'unlocked' : 'locked';
      case 'zones_6': return vCount >= 6 ? 'unlocked' : 'locked';
      case 'rooftop': return 'locked';
      case 'cartographer': return 'locked';
      case 'first_note': return vCount >= 4 ? 'unlocked' : 'locked';
      case 'team_reply': return 'locked';
      case 'collaborator': return 'locked';
      case 'showcase': return 'locked';
      default: return 'locked';
    }
  }

  /* ── Init state ── */
  function initState(){
    var s = computeState();
    STATE = s || MOCK_STATE;
  }

  /* ── Element refs ── */
  var $ = function(id){ return document.getElementById(id); };
  var viewport = $('viewport');
  var world = $('world');
  var connSvg = $('connSvg');
  var nodesContainer = $('nodesContainer');
  var detailPopup = $('detailPopup');

  /* ── Pan state ── */
  var panX = 0, panY = 0;
  var scale = 1;
  var isDragging = false;
  var dragStartX, dragStartY, dragPanX, dragPanY;
  var zoomIndicatorTimeout;

  /* ── Node map for lookup ── */
  var nodeMap = {};
  NODES.forEach(function(n){ nodeMap[n.id] = n; });

  /* ── Compute connections ── */
  function getConnections(){
    var conns = [];
    NODES.forEach(function(n){
      n.parent_ids.forEach(function(pid){
        var parent = nodeMap[pid];
        if (parent){
          conns.push({ from:parent, to:n });
        }
      });
    });
    return conns;
  }

  /* ── Determine connection line style ── */
  function getConnState(fromId, toId){
    var fs = STATE[fromId];
    var ts = STATE[toId];
    var fDone = fs === 'completed';
    var fUnlocked = fs === 'unlocked' || fs === 'completed';
    var tDone = ts === 'completed';
    var tUnlocked = ts === 'unlocked' || ts === 'completed';
    var fSecret = nodeMap[fromId] && nodeMap[fromId].is_secret;
    var tSecret = nodeMap[toId] && nodeMap[toId].is_secret;

    if (fSecret || tSecret){
      if (tDone) return 'secret-unlocked';
      return 'secret-line';
    }
    if (fDone && tDone) return 'all-completed';
    if (fUnlocked || tUnlocked) return 'any-unlocked';
    return '';
  }

  /* ── Render nodes ── */
  function renderNodes(){
    nodesContainer.innerHTML = '';
    NODES.forEach(function(n){
      var div = document.createElement('div');
      div.className = 'node';
      div.dataset.id = n.id;

      var state = STATE[n.id] || 'locked';
      var typeClass = n.type;
      var stateClass = state === 'completed' ? 'completed' :
                       state === 'unlocked' ? 'unlocked' :
                       state === 'locked_secret' ? 'secret-locked' :
                       state === 'locked' ? 'locked' : 'locked';

      // Secret node overrides
      if (n.is_secret && state === 'locked_secret'){
        div.classList.add('secret-locked', typeClass, n.type);
      } else if (n.is_secret){
        div.classList.add('secret', typeClass, n.type);
      } else {
        div.classList.add(stateClass, typeClass, n.type);
      }

      div.style.left = n.x + 'px';
      div.style.top = n.y + 'px';

      var showSecretIcon = n.is_secret && state === 'locked_secret';

      var inner = document.createElement('div');
      inner.className = 'node-inner';
      inner.innerHTML =
        (state === 'completed' ? '<span class="check-badge">✓</span>' : '') +
        '<span class="node-icon">' + (showSecretIcon ? '🔮' : n.icon) + '</span>' +
        '<span class="node-label">' + (showSecretIcon ? '???' : (n.type.toUpperCase())) + '</span>';

      div.appendChild(inner);

      var title = document.createElement('div');
      title.className = 'node-title';
      title.textContent = showSecretIcon ? '???' : n.title;
      div.appendChild(title);

      div.addEventListener('click', function(){ showDetail(n.id); });
      nodesContainer.appendChild(div);
    });
  }

  /* ── Render SVG connections using quadratic bezier curves ── */
  function renderConnections(){
    var conns = getConnections();
    var html = '';
    conns.forEach(function(c){
      var cx = (c.from.x + c.to.x) / 2;
      var cy = (c.from.y + c.to.y) / 2;
      var dx = c.to.x - c.from.x;
      var dy = c.to.y - c.from.y;
      // Control point offset for organic curves
      var cpx = cx;
      var cpy = cy;
      if (Math.abs(dx) > 30){
        // Horizontal-ish: curve up/down
        cpy = cy + Math.abs(dx) * 0.12;
      } else {
        // Vertical-ish: slight S-curve
        cpx = cx + Math.abs(dy) * 0.06;
      }

      var stateClass = getConnState(c.from.id, c.to.id);

      html += '<path class="conn-line' +
        (stateClass ? ' ' + stateClass : '') +
        '" d="M' + c.from.x + ',' + c.from.y +
        ' Q' + cpx + ',' + cpy + ' ' + c.to.x + ',' + c.to.y + '" />';
    });
    connSvg.innerHTML = html;
  }

  /* ── Pan / Zoom ── */
  function updateTransform(){
    world.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
  }

  function setZoom(newScale, cx, cy){
    var oldScale = scale;
    scale = Math.max(0.3, Math.min(2.5, newScale));
    // Zoom toward cursor position
    if (cx !== undefined && cy !== undefined){
      panX = cx - (cx - panX) * (scale / oldScale);
      panY = cy - (cy - panY) * (scale / oldScale);
    }
    updateTransform();
    $('zoomLevel').textContent = Math.round(scale * 100) + '%';
    showZoomIndicator(Math.round(scale * 100) + '%');
  }

  function showZoomIndicator(text){
    var el = $('zoomIndicator');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(zoomIndicatorTimeout);
    zoomIndicatorTimeout = setTimeout(function(){ el.classList.remove('show'); }, 1200);
  }

  /* ── Init pan/zoom events ── */
  function initPanZoom(){
    // Mouse pan
    viewport.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      if (e.target.closest('.tree-ctrl, .back-link, .detail-popup, .detail-popup *')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragPanX = panX;
      dragPanY = panY;
      viewport.classList.add('dragging');
    });

    window.addEventListener('mousemove', function(e){
      if (!isDragging) return;
      panX = dragPanX + (e.clientX - dragStartX);
      panY = dragPanY + (e.clientY - dragStartY);
      updateTransform();
    });

    window.addEventListener('mouseup', function(){
      isDragging = false;
      viewport.classList.remove('dragging');
    });

    // Touch pan
    var touchStartX, touchStartY, touchPanX, touchPanY;
    viewport.addEventListener('touchstart', function(e){
      if (e.touches.length === 1){
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchPanX = panX;
        touchPanY = panY;
      }
    }, { passive:true });

    viewport.addEventListener('touchmove', function(e){
      if (e.touches.length === 1){
        panX = touchPanX + (e.touches[0].clientX - touchStartX);
        panY = touchPanY + (e.touches[0].clientY - touchStartY);
        updateTransform();
      }
    }, { passive:true });

    // Scroll zoom
    viewport.addEventListener('wheel', function(e){
      e.preventDefault();
      var delta = -e.deltaY * 0.001;
      var newScale = scale * (1 + delta);
      setZoom(newScale, e.clientX, e.clientY);
    }, { passive:false });

    // Buttons
    $('zoomIn').addEventListener('click', function(){
      setZoom(scale * 1.25, window.innerWidth/2, window.innerHeight/2);
    });
    $('zoomOut').addEventListener('click', function(){
      setZoom(scale * 0.8, window.innerWidth/2, window.innerHeight/2);
    });
    $('resetView').addEventListener('click', function(){
      panX = 0; panY = 0; scale = 1;
      updateTransform();
      $('zoomLevel').textContent = '100%';
      showZoomIndicator('100%');
    });
  }

  /* ── Detail popup ── */
  var currentDetail = null;

  function showDetail(nodeId){
    var n = nodeMap[nodeId];
    if (!n) return;
    var state = STATE[nodeId] || 'locked';

    $('dpIcon').textContent = n.icon;
    $('dpTitle').textContent = n.is_secret && state === 'locked_secret' ? '???' : n.title;
    $('dpType').textContent = n.type.toUpperCase() + (n.is_secret ? ' · SECRET' : '');
    $('dpDesc').textContent = state === 'locked_secret' ? 'A mysterious node shrouded in shadow. Complete nearby achievements to reveal its secret.' :
                              state === 'locked' ? 'Keep exploring the venue. Complete related achievements to unlock this node.' :
                              n.desc;

    var statusEl = $('dpStatus');
    if (state === 'completed'){
      statusEl.className = 'dp-status completed';
      statusEl.textContent = '✓ Completed';
    } else if (state === 'unlocked'){
      statusEl.className = 'dp-status unlocked';
      statusEl.textContent = '○ Unlocked';
    } else if (state === 'locked_secret'){
      statusEl.className = 'dp-status secret';
      statusEl.textContent = '🔮 Classified';
    } else {
      statusEl.className = 'dp-status locked';
      statusEl.textContent = '● Locked';
    }

    currentDetail = nodeId;
    detailPopup.classList.add('show');
  }

  function hideDetail(){
    detailPopup.classList.remove('show');
    currentDetail = null;
  }

  $('dpDismiss').addEventListener('click', hideDetail);
  detailPopup.addEventListener('click', function(e){
    if (e.target === detailPopup) hideDetail();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') hideDetail();
  });

  /* ── Full render ── */
  function render(){
    renderNodes();
    renderConnections();
    // Center view on first render
    if (panX === 0 && panY === 0 && scale === 1){
      panX = window.innerWidth / 2 - 450;
      panY = window.innerHeight / 2 - 300;
      updateTransform();
    }
  }

  /* ── Init ── */
  function init(){
    initState();
    initPanZoom();
    render();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
